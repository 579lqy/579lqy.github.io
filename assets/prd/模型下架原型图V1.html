<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token工场 — 模型下架 交互原型</title>
<style>
  :root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --danger: #DC2626;
    --danger-hover: #B91C1C;
    --success: #059669;
    --warning: #D97706;
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --border: #E2E8F0;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* Header */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
  .header-tag { font-size: 12px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 4px; }
  .view-switcher { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius); padding: 3px; }
  .view-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--text-secondary);
    transition: all .15s;
  }
  .view-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: var(--shadow);
  }
  .view-btn:hover:not(.active) { color: var(--text); }

  /* Main */
  .main { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Section Title */
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--primary);
    border-radius: 2px;
  }

  /* Flow Steps Visual */
  .flow-steps {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 20px 0;
    margin-bottom: 24px;
  }
  .flow-step {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .flow-step-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .flow-step-label { font-size: 13px; font-weight: 500; white-space: nowrap; }
  .flow-arrow {
    margin: 0 16px;
    color: var(--text-muted);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* Card */
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 15px;
  }
  .card-body { padding: 20px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 10px 14px;
    background: #F8FAFC;
    color: var(--text-secondary);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FAFBFC; }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-online { background: #ECFDF5; color: var(--success); }
  .badge-offline { background: #FEF2F2; color: var(--danger); }
  .badge-draft { background: #F1F5F9; color: var(--text-muted); }
  .badge-pending { background: #FEF9C3; color: #A16207; }

  /* Buttons */
  .btn {
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    background: var(--card);
    color: var(--text);
    transition: all .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #F8FAFC; }
  .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 24px; font-size: 15px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

  /* Modal Overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15,23,42,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    animation: modalIn .2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-10px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 16px;
    font-weight: 600;
  }
  .modal-close {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: var(--bg); }
  .modal-body { padding: 24px; }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* Form */
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .form-label .required { color: var(--danger); margin-left: 2px; }
  .form-label .hint { font-weight: 400; color: var(--text-muted); margin-left: 6px; font-size: 12px; }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    transition: border-color .15s;
    background: var(--card);
    color: var(--text);
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
  }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-select { cursor: pointer; }

  /* Scene cards */
  .scene-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .scene-card {
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .15s;
  }
  .scene-card:hover { border-color: #C7D2FE; background: #F5F3FF; }
  .scene-card.selected { border-color: var(--primary); background: #EEF2FF; }
  .scene-card-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .scene-card-desc { font-size: 12px; color: var(--text-muted); }
  .scene-card-badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 10px;
    margin-top: 6px;
  }
  .scene-card-badge.fast { background: #FEF2F2; color: var(--danger); }
  .scene-card-badge.normal { background: #FEF9C3; color: #A16207; }
  .scene-card-badge.slow { background: #ECFDF5; color: var(--success); }

  /* Impact Preview */
  .impact-box {
    background: #FFFBEB;
    border: 1px solid #FDE68A;
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 16px;
  }
  .impact-box h4 { font-size: 13px; color: #92400E; margin-bottom: 8px; }
  .impact-stats { display: flex; gap: 24px; }
  .impact-stat { text-align: center; }
  .impact-stat .num { font-size: 24px; font-weight: 700; color: #92400E; }
  .impact-stat .label { font-size: 12px; color: #A16207; margin-top: 2px; }

  /* Confirm Dialog */
  .confirm-box {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .confirm-box .warning-icon { font-size: 20px; }
  .confirm-box h4 { color: var(--danger); font-size: 14px; margin: 8px 0 4px; }
  .confirm-box p { color: #7F1D1D; font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--success);
    color: white;
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    z-index: 300;
    animation: toastIn .3s ease, toastOut .3s ease 2.5s forwards;
    display: none;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* User-side notice banner */
  .notice-banner {
    background: #FEF2F2;
    border-left: 3px solid var(--danger);
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    font-size: 13px;
    color: #991B1B;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .notice-banner .notice-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  .text-muted { color: var(--text-muted); font-size: 12px; }
  .mt-2 { margin-top: 8px; }
  .mt-4 { margin-top: 16px; }
  .mb-2 { margin-bottom: 8px; }
  .gap-2 { display: flex; gap: 8px; }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
  }

  .step-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .step-dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }
  .step-dot.active { background: var(--primary); color: white; }
  .step-dot.done { background: var(--success); color: white; }
  .step-line { width: 40px; height: 2px; background: var(--border); }
  .step-line.done { background: var(--success); }

  /* Compensation */
  .compensation-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all .15s;
    position: relative;
  }
  .compensation-card:hover { border-color: #C7D2FE; background: #FAFBFF; }
  .compensation-card.selected {
    border-color: var(--primary);
    background: #EEF2FF;
    box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
  }
  .compensation-card.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #F8FAFC;
  }
  .compensation-card-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .compensation-card-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .compensation-card-value {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }
  .compensation-card-value .unit {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .compensation-card .radio {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-radius: 50%;
  }
  .compensation-card.selected .radio {
    border-color: var(--primary);
    background: var(--primary);
    box-shadow: inset 0 0 0 3px white;
  }
  .compensation-product-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    background: #FAFBFC;
  }
  .compensation-product-card h4 {
    font-size: 14px;
    margin-bottom: 4px;
  }
  .compensation-product-card .meta {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .compensation-product-card .deadline {
    margin-top: 8px;
    font-size: 12px;
    color: var(--danger);
    font-weight: 500;
  }
  .compensation-product-card .compensated {
    margin-top: 8px;
    font-size: 12px;
    color: var(--success);
    font-weight: 500;
  }
</style>
</head>

    const comp = compensationState[plane.planeId];

    let statusHtml = '<span class="badge badge-online">使用中</span>';
    let actionHtml = '';

    if (offlineModels.length > 0) {

        statusHtml = '<span class="badge badge-offline">已补偿</span>';

// --- EXECUTE ---
function executeOffline() {
  const model = models.find(m => m.id === selectedModelId);

  // Simulate backend: mark as offline
  offlineMap[selectedModelId] = {
    scene: offlineData.scene,
    sceneLabel: offlineData.sceneLabel,
    effectiveDate: offlineData.effectiveDate,
    reason: offlineData.reason,
    notice: offlineData.notice,
    operator: 'admin_zhang',
    offlineTime: new Date().toISOString(),
  };

  // Close modal
  document.getElementById('offline-modal').classList.remove('active');

  // Show toast
  showToast(`模型"${model.name}"已成功下架，已通知 ${model.users} 位用户`);

  // Refresh tables
  renderModelTable();

  // Reset
  currentStep = 1;
  selectedModelId = null;
  offlineData = {};
}

function showToast(msg) {
  const toast = document.getElementById('toast');

  toast.style.animation = 'toastIn .3s ease, toastOut .3s ease 2.5s forwards';

}

  container.style.display = 'block';
  container.innerHTML = `
    <h4 style="margin-bottom:10px;font-size:14px;">选择目标模型</h4>
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">系统已按同供应商、同能力标签为您推荐可替换模型</div>
    <div id="transfer-model-list">
      ${transferTargetModels.map(m => `
        <div class="compensation-card" onclick="selectTransferModel('${m.id}', this)" data-model="${m.id}" style="padding:12px;">
          <div class="radio"></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <div class="compensation-card-title" style="font-size:13px;">
                ${m.name}
                ${m.recommended ? '<span class="badge badge-online" style="margin-left:6px;font-size:10px;">推荐</span>' : ''}
              </div>
              <div class="compensation-card-desc" style="margin-top:4px;">
                供应商：${m.supplier} · 标签：${m.tags.join('、')}
              </div>
              <div style="margin-top:6px;font-size:12px;color:var(--text-secondary);">
                换算比例：<strong style="color:var(--primary);">1 : ${m.ratio}</strong>
                <span style="margin-left:12px;">转移后约得 <strong>${Math.round(120 * m.ratio)}万</strong> Token</span>
              </div>
            </div>
          </div>
          <div style="margin-top:10px;">
            <a href="${m.apiUrl}" target="_blank" class="btn btn-sm" style="text-decoration:none;" onclick="event.stopPropagation();">📄 查看 API 文档</a>
          </div>
        </div>
      `).join('')}
    </div>
    <div id="selected-model-api-note" style="display:none;margin-top:12px;padding:10px 12px;background:#EFF6FF;border-radius:6px;font-size:12px;color:#1E40AF;"></div>
  `;
}

function selectTransferModel(modelId, el) {
  document.querySelectorAll('#transfer-model-list .compensation-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedTransferModel = transferTargetModels.find(m => m.id === modelId);

  const note = document.getElementById('selected-model-api-note');
  note.style.display = 'block';
  note.innerHTML = `
    您选择了 <strong>${selectedTransferModel.name}</strong>（模型ID：${selectedTransferModel.id}）。<br>
    下架生效后，请将调用参数中的 model_id 替换为 <code>${selectedTransferModel.id}</code>。
    <a href="${selectedTransferModel.apiUrl}" target="_blank" style="color:var(--primary);margin-left:6px;">查看完整 API 文档 →</a>
  `;

  document.getElementById('btn-confirm-compensation').disabled = false;
}

function closeCompensationModal() {
  document.getElementById('compensation-modal').classList.remove('active');
  currentCompensationProduct = null;
  selectedCompensationOption = null;
  selectedTransferModel = null;
}

function confirmCompensation() {
  const { productId, productType } = currentCompensationProduct;

  // Simulate backend compensation
  if (selectedCompensationOption === 'VOUCHER') {
    const amount = productType === 'TOKEN_PACKAGE' ? 45.00 : 35.00;
    compensationState[productId] = { option: 'VOUCHER', voucherAmount: amount, voucherCode: 'VC' + Date.now() };
  } else if (selectedCompensationOption === 'TRANSFER') {
    compensationState[productId] = { option: 'TRANSFER', targetModel: selectedTransferModel };
  }

  document.getElementById('compensation-modal').classList.remove('active');

  const optionLabels = {
    'TRANSFER': `额度转移 → ${selectedTransferModel?.name || ''}`,
    'VOUCHER': '代金券发放'
  };
  showToast(`权益补偿已确认：${optionLabels[selectedCompensationOption]}`);

  renderUserTokenTable();

  currentCompensationProduct = null;
  selectedCompensationOption = null;
  selectedTransferModel = null;
}

// ===================== INIT =====================
renderModelTable();
</script>

</body>
</html>
