<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的账单 - 交互原型</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
</head>
<body style="margin:0;">
<div id="app"></div>
<style>
#app { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2329; font-size: 14px; }
#app * { box-sizing: border-box; }
.top-space-tabs { display: flex; gap: 4px; padding: 12px 24px; border-bottom: 1px solid #e5e6eb; background: #fff; }
.space-tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; color: #4e5969; display: flex; align-items: center; gap: 6px; }
.space-tab.active { background: #e8f1fd; color: #1677d6; font-weight: 500; }
.page { padding: 24px 28px; background: #f7f8fa; min-height: 500px; }
.page-title { font-size: 20px; font-weight: 500; margin: 0 0 16px; display: flex; align-items: center; justify-content: space-between; }
.page-title-left { display: flex; align-items: center; gap: 8px; }
.page-title-left .bar { width: 4px; height: 20px; background: #1677d6; border-radius: 2px; }
.btn { padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #d0d3d9; background: #fff; color: #4e5969; }
.btn:hover { border-color: #1677d6; color: #1677d6; }
.btn-primary { background: #1677d6; border-color: #1677d6; color: #fff; }
.btn-primary:hover { background: #135fb0; color: #fff; }
.btn-row { display: flex; gap: 10px; }
.notice { background: #eaf2fe; border: 1px solid #cfe2fb; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #4e5969; line-height: 1.9; margin-bottom: 16px; }
.notice b { color: #1677d6; }
.filter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.month-picker { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid #d0d3d9; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; }
.summary-card { background: #fff; border: 1px solid #e5e6eb; border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; }
.summary-top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid #f0f1f3; margin-bottom: 18px; }
.summary-top-left { display: flex; align-items: center; gap: 16px; }
.period-title { font-size: 16px; font-weight: 500; }
.period-range { font-size: 13px; color: #86909c; }
.status-tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 4px; font-size: 12px; }
.status-billing { background: #fdf3e0; color: #b3690a; }
.status-billed { background: #e2f4e9; color: #178a4c; }
.status-settled { background: #e2f4e9; color: #178a4c; }
.status-owing { background: #fef0ec; color: #d94024; }
.amounts { display: flex; gap: 64px; flex-wrap: wrap; }
.amount-item .label { font-size: 13px; color: #86909c; margin-bottom: 8px; }
.amount-item .value { font-size: 26px; font-weight: 500; }
.amount-item .link { font-size: 12px; color: #1677d6; cursor: pointer; margin-left: 6px; }
.dim-tabs { display: flex; gap: 4px; background: #fff; border: 1px solid #e5e6eb; border-radius: 10px 10px 0 0; border-bottom: none; padding: 0 20px; }
.dim-tab { padding: 14px 4px; margin-right: 28px; font-size: 14px; color: #4e5969; cursor: pointer; border-bottom: 2px solid transparent; }
.dim-tab.active { color: #1677d6; border-bottom-color: #1677d6; font-weight: 500; }
.filter-chip { display: inline-flex; align-items: center; gap: 6px; background: #eaf2fe; color: #1677d6; padding: 4px 10px; border-radius: 5px; font-size: 12px; margin: 12px 20px 0; }
.filter-chip .x { cursor: pointer; font-weight: 500; }
.table-wrap { background: #fff; border: 1px solid #e5e6eb; border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: #86909c; font-size: 12px; padding: 12px 20px; background: #fafbfc; border-bottom: 1px solid #f0f1f3; white-space: nowrap; }
td { padding: 14px 20px; border-bottom: 1px solid #f0f1f3; font-size: 13px; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
.op-link { color: #1677d6; cursor: pointer; }
.empty-row td { text-align: center; color: #c9cdd4; padding: 48px 0; }
.crumb { color: #86909c; font-size: 13px; cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 4px; }
.crumb:hover { color: #1677d6; }
.detail-head { background: #fff; border: 1px solid #e5e6eb; border-radius: 10px; padding: 18px 24px; margin-bottom: 16px; display: flex; align-items: center; gap: 48px; }
.detail-head .item .label { font-size: 12px; color: #86909c; margin-bottom: 4px; }
.detail-head .item .value { font-size: 14px; }
.section-title { font-size: 15px; font-weight: 500; margin: 20px 0 12px; }
.money { font-variant-numeric: tabular-nums; }
.info-icon { color: #c9cdd4; font-size: 12px; cursor: default; }
.tt-wrap { position: relative; display: inline-flex; align-items: center; }
.tt-wrap .tt-icon { color: #c9cdd4; font-size: 13px; cursor: default; margin-left: 2px; }
.tt-wrap .tt-content { display: none; position: absolute; top: 22px; left: 0; background: #fff; border: 1px solid #e5e6eb; box-shadow: 0 6px 20px rgba(0,0,0,0.10); border-radius: 8px; padding: 14px 16px; width: 360px; font-size: 12px; line-height: 1.9; color: #4e5969; z-index: 30; white-space: normal; }
.tt-wrap:hover .tt-content { display: block; }
.tt-content b { color: #1f2329; }
.month-picker-wrap { position: relative; }
.acct-picker-wrap { position: relative; }
.acct-picker { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid #d0d3d9; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; }
.acct-drop { position: absolute; top: 44px; left: 0; background: #fff; border: 1px solid #e5e6eb; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-radius: 8px; padding: 10px; width: 320px; z-index: 30; }
.acct-search { width: 100%; padding: 7px 10px; border: 1px solid #d0d3d9; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }
.acct-list { max-height: 240px; overflow-y: auto; }
.acct-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.acct-item:hover { background: #f2f3f5; }
.acct-item.selected { background: #e8f1fd; }
.acct-item-main { display: flex; flex-direction: column; gap: 2px; }
.acct-item-name { font-size: 13px; color: #1f2329; }
.acct-item-id { font-size: 11px; color: #86909c; }
.table-title { font-size: 14px; font-weight: 500; margin: 4px 0 10px; display: flex; align-items: center; gap: 8px; }
.table-title-sub { font-size: 12px; font-weight: 400; color: #86909c; background: #f2f3f5; padding: 2px 8px; border-radius: 4px; }
.calendar-drop { position: absolute; top: 44px; left: 0; background: #fff; border: 1px solid #e5e6eb; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-radius: 8px; padding: 14px 16px; width: 300px; z-index: 30; }
.cal-year-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 14px; font-weight: 500; }
.cal-year-row i { cursor: pointer; color: #4e5969; font-size: 15px; }
.cal-year-row i:hover { color: #1677d6; }
.cal-year-row i.nav-disabled { color: #e5e6eb; cursor: not-allowed; }
.cal-year-row i.nav-disabled:hover { color: #e5e6eb; }
.cal-hint { margin-top: 10px; font-size: 11px; color: #c9cdd4; text-align: center; }
.cal-month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cal-month { text-align: center; padding: 8px 0; border-radius: 6px; font-size: 13px; cursor: pointer; color: #4e5969; }
.cal-month:hover { background: #f2f3f5; }
.cal-month.selected { background: #1677d6; color: #fff; }
.cal-month.disabled { color: #c9cdd4; cursor: not-allowed; }
.cal-month.disabled:hover { background: none; }
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-box { background: #fff; border-radius: 10px; width: 640px; max-width: 92vw; max-height: 84vh; overflow: auto; padding: 22px 26px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-head .title { font-size: 17px; font-weight: 500; }
.modal-head .close { cursor: pointer; color: #86909c; font-size: 18px; }
.modal-head .close:hover { color: #1f2329; }
.modal-row { margin-bottom: 18px; }
.modal-row .req { color: #d94024; margin-right: 3px; }
.modal-row .rlabel { font-size: 13px; color: #1f2329; margin-bottom: 8px; font-weight: 500; }
.radio-row { display: flex; gap: 24px; font-size: 13px; }
.radio-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.month-range { display: flex; align-items: center; gap: 10px; }
.month-range input, select.msel { padding: 7px 10px; border: 1px solid #d0d3d9; border-radius: 6px; font-size: 13px; color: #1f2329; }
.check-row { display: flex; gap: 24px; font-size: 13px; }
.check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.repay-summary { display: flex; gap: 48px; margin-bottom: 16px; }
.repay-summary .label { font-size: 12px; color: #86909c; margin-bottom: 4px; }
.repay-summary .value { font-size: 15px; }
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; font-size: 12px; color: #86909c; border-top: 1px solid #f0f1f3; }
.page-btns { display: flex; gap: 8px; }
.page-btn { padding: 5px 12px; font-size: 12px; }
.page-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.page-btn[disabled]:hover { border-color: #d0d3d9; color: #4e5969; }
.expand-arrow { cursor: pointer; color: #86909c; font-size: 15px; }
.expand-arrow:hover { color: #1677d6; }
tr.ledger-row td { padding: 0; background: #fafbfc; }
.ledger-table { width: 100%; border-collapse: collapse; }
.ledger-table th { background: #f2f3f5; padding: 8px 20px 8px 52px; font-size: 11px; }
.ledger-table td { padding: 10px 20px 10px 52px; font-size: 12px; border-bottom: 1px solid #f0f1f3; }
.ledger-table tr:last-child td { border-bottom: none; }
</style>
<script>
(function(){
  const root = document.getElementById('app');

  const productRows = [
    { billNo:'100000000000041001', product:'智能体服务', sku:'智能体服务-标准版-月度', feeType:'包年包月', month:'2026-07', list:0.01, discount:0.00, afterDiscount:0.01, paidAmt:0.01, dueAmt:0.00, payStatus:'已销账', org:'个人空间' },
    { billNo:'100000000000041002', product:'video_gen_dctest_20260629_1-times-Quantity-package', sku:'视频生成-次卡', feeType:'按量计费', month:'2026-07', list:0.00, discount:0.00, afterDiscount:0.00, paidAmt:0.00, dueAmt:0.00, payStatus:'已销账', org:'oncon_2S8LHlM25PF_98110000100000003' },
    { billNo:'100000000000041003', product:'Doubao-Seed-2.0-pro-token-Quantity-package', sku:'Token量包', feeType:'Token资源包', month:'2026-07', list:0.01, discount:0.00, afterDiscount:0.01, paidAmt:0.01, dueAmt:0.00, payStatus:'已销账', org:'oncon_2S8LHlM25PF_98110000100000003' },
    { billNo:'100000000000041004', product:'MiniMax-M3-token-Quantity-package', sku:'Token量包', feeType:'Token资源包', month:'2026-07', list:118.07, discount:0.00, afterDiscount:118.07, paidAmt:118.07, dueAmt:0.00, payStatus:'已销账', org:'98110000100000003_0' },
    { billNo:'100000000000041005', product:'kimi-k2.6-token-Quantity-package', sku:'Token量包', feeType:'Token资源包', month:'2026-07', list:0.03, discount:0.00, afterDiscount:0.03, paidAmt:0.03, dueAmt:0.00, payStatus:'已销账', org:'个人空间' },
    { billNo:'100000000000041006', product:'deepseek-v4-flash-token-use-package', sku:'Token按量使用', feeType:'Token Plane', month:'2026-07', list:0.00, discount:0.00, afterDiscount:0.00, paidAmt:0.00, dueAmt:0.00, payStatus:'已销账', org:'个人空间',
      detail:[
        { id:'100000000000021298', time:'2026-07-01 21:17:23', amt:0.000, paid:0.000, due:0.000 },
        { id:'100000000000020587', time:'2026-07-01 13:41:00', amt:0.000, paid:0.000, due:0.000 },
        { id:'100000000000019845', time:'2026-06-30 08:02:41', amt:0.000, paid:0.000, due:0.000 }
      ] },
    { billNo:'100000000000041007', product:'Kimi-K2.7-Code-0704-token-use-package', sku:'Token按量使用', feeType:'Token Plane', month:'2026-07', list:0.00, discount:0.00, afterDiscount:0.00, paidAmt:0.00, dueAmt:0.00, payStatus:'已销账', org:'oncon_2S8ypstfV6i_98110000100000003' },
    { billNo:'100000000000033490', product:'YearMonthly-package', sku:'年度包月套餐', feeType:'包年包月', month:'2026-07', list:31.19, discount:0.00, afterDiscount:31.1885, paidAmt:31.1885, dueAmt:0.00, payStatus:'已销账', org:'oncon_2S8hWov6MoX_98110000100000003',
      ledger:[
        { ledgerType:'体验金', acctType:'支付账户(个人/企业默认)', paid:31.1885 }
      ] },
  ];

  const acctRows = [
    { acctId:'98110000100000003_0', acctName:'易信内测2', customerName:'易信内测2', billCount:1, billTotal:1080.5717, billStatus:'已销账' },
    { acctId:'oncon_2S8LHlM25PF_98110000100000003', acctName:'huangdc易信内测2', customerName:'易信内测2', billCount:1, billTotal:200.7470, billStatus:'已销账' },
    { acctId:'oncon_2S8ypstfV6i_98110000100000003', acctName:'zhangsan2易信内测2', customerName:'易信内测2', billCount:1, billTotal:18.1300, billStatus:'已销账' },
    { acctId:'oncon_2Sun8DqEqAR_98110000100000003', acctName:'-', customerName:'易信内测2', billCount:1, billTotal:0.0000, billStatus:'已销账' },
    { acctId:'oncon_2S8hWov6MoX_98110000100000003', acctName:'admin易信内测2', customerName:'易信内测2', billCount:1, billTotal:1186.1200, billStatus:'已销账' },
  ];
  function acctDisplayName(id){ const a = acctRows.find(x=>x.acctId===id); return a ? `${a.acctName}（${a.acctId}）` : id; }
  function acctShortLabel(id){ const a = acctRows.find(x=>x.acctId===id); return a ? `${a.acctName}<br><span style="color:#86909c;font-size:11px">${a.acctId}</span>` : (id||'-'); }

  const repayRecords = [
    { time:'2026-07-03 09:12:00', account:'易信内测2', payable:118.07, coupon:0, card:0, cash:118.07, payer:'支付宝实名账户' },
    { time:'2026-07-08 14:30:20', account:'易信内测2', payable:0.01, coupon:0, card:0, cash:0.01, payer:'支付宝实名账户' },
    { time:'2026-07-15 20:05:11', account:'个人空间', payable:0.04, coupon:0, card:0, cash:0.04, payer:'微信支付账户' },
  ];

  const state = { space:'personal', orgFilter:null, view:'overview', detailRow:null,
    billMonth:'2026-07', pickerYear:2026, monthOpen:false, acctOpen:false, showExportModal:false,
    prodPage:1, detailPage:1, repayPage:1, expanded:{} };

  const CURRENT_YEAR = 2026, CURRENT_MONTH = 7;
  const PAGE_SIZE = 3;

  function paginate(list, page, size){
    const totalPages = Math.max(1, Math.ceil(list.length / size));
    const p = Math.min(page, totalPages);
    return { items: list.slice((p-1)*size, p*size), page: p, totalPages, total: list.length };
  }

  function renderPagination(page, totalPages, total, prevFn, nextFn){
    return `
      <div class="pagination">
        <span>共 ${total} 条，第 ${page}/${totalPages} 页</span>
        <div class="page-btns">
          <button class="btn page-btn" ${page<=1?'disabled':''} onclick="${page<=1?'':prevFn}">上一页</button>
          <button class="btn page-btn" ${page>=totalPages?'disabled':''} onclick="${page>=totalPages?'':nextFn}">下一页</button>
        </div>
      </div>
    `;
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function periodRange(billMonth){
    const [y,m] = billMonth.split('-').map(Number);
    return `${y}-${pad2(m)}-01 至 ${y}-${pad2(m)}-${pad2(daysInMonth(y,m))}`;
  }

  function money(v){ return '¥' + Number(v).toFixed(2); }

  function payBadge(s){
    if (s === '已销账') return `<span class="status-tag status-settled">已销账</span>`;
    if (s === '待还款') return `<span class="status-tag status-owing">待还款</span>`;
    return `<span class="status-tag status-billed">${s}</span>`;
  }

  function periodStatus(billMonth, due){
    const isCurrent = billMonth === `${CURRENT_YEAR}-${pad2(CURRENT_MONTH)}`;
    if (isCurrent) return { text:'出账中', cls:'status-billing' };
    if (due > 0) return { text:'未结清', cls:'status-owing' };
    return { text:'已结清', cls:'status-settled' };
  }

  function render(){
    let body;
    if (state.view === 'overview') body = renderOverview();
    else if (state.view === 'detail') body = renderDetail();
    else body = renderRepayPage();
    root.innerHTML = `
      <div class="top-space-tabs">
        <div class="space-tab ${state.space==='personal'?'active':''}" onclick="__setSpace('personal')"><i class="ti ti-user" style="font-size:15px"></i>个人空间</div>
        <div class="space-tab ${state.space==='enterprise'?'active':''}" onclick="__setSpace('enterprise')"><i class="ti ti-building" style="font-size:15px"></i>企业空间</div>
      </div>
      <div class="page">${body}</div>
    `;
  }

  function renderOverview(){
    const isEnt = state.space === 'enterprise';
    const rows = filteredRows();
    const total = rows.reduce((a,r)=>a+r.afterDiscount,0);
    const due = rows.reduce((a,r)=> a + r.dueAmt, 0);
    const paid = rows.reduce((a,r)=> a + r.paidAmt, 0);
    const st = periodStatus(state.billMonth, due);

    return `
      <div class="page-title">
        <div class="page-title-left"><div class="bar"></div>月账单概览</div>
      </div>

      <div class="notice">
        1. 当月最终账单在次月 2 日 12 点后支持查看/导出，在此之前的数据查询结果仅供参考，不作为对账依据；<br>
        2. 月账单概览数据相对于实际费用消耗延迟 5 小时更新；<br>
        3. 支持查询/导出近 12 个月的账单数据。
      </div>

      <div class="filter-row">
        <div class="month-picker-wrap">
          <div class="month-picker" onclick="__toggleMonthPicker(event)"><i class="ti ti-calendar"></i> 账单月份 ${state.billMonth} <i class="ti ti-chevron-down" style="font-size:13px;color:#86909c"></i></div>
          ${state.monthOpen ? renderCalendarDrop() : ''}
        </div>
        ${isEnt ? `
        <div class="acct-picker-wrap">
          <div class="acct-picker" onclick="__toggleAcctPicker(event)"><i class="ti ti-users"></i> 账户：${state.orgFilter ? acctDisplayName(state.orgFilter) : '全部账户'} <i class="ti ti-chevron-down" style="font-size:13px;color:#86909c"></i></div>
          ${state.acctOpen ? renderAcctDrop() : ''}
        </div>` : ``}
      </div>

      <div class="summary-card">
        <div class="summary-top">
          <div class="summary-top-left">
            <div>
              <div class="period-title">${Number(state.billMonth.split('-')[1])}月概览</div>
              <div class="period-range">账单周期 ${periodRange(state.billMonth)}</div>
            </div>
            <span class="status-tag ${st.cls}">${st.text}</span>
            <div class="tt-wrap">
              <i class="ti ti-help-circle tt-icon"></i>
              <div class="tt-content">
                <b>全部状态说明：</b><br>
                1. 出账中：账单按月出账，当月最终账单在次月2日12点完成出账。在此之前账单状态显示为「出账中」。<br>
                2. 未结清：账单出账完成后，若存在未结清的欠款，状态显示为「未结清」。<br>
                3. 已结清：所有欠款已还清，状态更新为「已结清」。<br>
                * 单独说明：如在企业多账号下，管理员查看多个成员账号时，依据所有成员账号的账单状态综合判定总状态。<br><br>
                <b>状态更新时间：</b><br>
                · 历史月份账单：还款成功后，约5小时内自动更新为「已结清」。<br>
                · 当月账单：当月「未结清」账单还款后，系统将在次月2日12点统一结算并更新状态至「已结清」。
              </div>
            </div>
          </div>
          <button class="btn btn-primary" onclick="__openExportModal()"><i class="ti ti-download" style="font-size:14px"></i> 导出账单</button>
        </div>
        <div class="amounts">
          <div class="amount-item">
            <div class="label">应付金额</div>
            <div class="value money">${money(total)}</div>
          </div>
          <div class="amount-item">
            <div class="label">已还款金额 <span class="link" onclick="__openRepayPage()">查看详情</span></div>
            <div class="value money">${money(paid)}</div>
          </div>
          <div class="amount-item">
            <div class="label">待还款金额
              <span class="tt-wrap">
                <i class="ti ti-help-circle tt-icon"></i>
                <span class="tt-content">待还款金额 = 应付金额 − 已还款金额，即当前账期内尚未结清的欠款部分。</span>
              </span>
            </div>
            <div class="value money">${money(due)}</div>
          </div>
        </div>
      </div>

      <div class="table-title">消费明细<span class="table-title-sub">按产品</span></div>
      <div class="table-wrap">
        ${renderProductTable(rows)}
      </div>
      ${state.showExportModal ? renderExportModal() : ''}
    `;
  }

  function monthIdx(y,m){ return y*12+m; }
  const CUR_IDX = monthIdx(CURRENT_YEAR, CURRENT_MONTH);
  const MIN_IDX = CUR_IDX - 11; // 近12个月窗口（含当月）
  const MIN_YEAR = Math.floor((MIN_IDX-1)/12);
  const MIN_MONTH = MIN_IDX - MIN_YEAR*12;

  function renderCalendarDrop(){
    const months = [];
    for (let m=1; m<=12; m++){
      const idx = monthIdx(state.pickerYear, m);
      const disabled = idx > CUR_IDX || idx < MIN_IDX;
      const value = `${state.pickerYear}-${pad2(m)}`;
      const selected = value === state.billMonth;
      months.push(`<div class="cal-month ${selected?'selected':''} ${disabled?'disabled':''}" onclick="${disabled?'':`__selectMonth('${value}')`}">${m}月</div>`);
    }
    const prevDisabled = state.pickerYear <= MIN_YEAR;
    const nextDisabled = state.pickerYear >= CURRENT_YEAR;
    return `
      <div class="calendar-drop" onclick="event.stopPropagation()">
        <div class="cal-year-row">
          <i class="ti ti-chevrons-left ${prevDisabled?'nav-disabled':''}" onclick="${prevDisabled?'':'__navYear(-1)'}"></i>
          <span>${state.pickerYear}年</span>
          <i class="ti ti-chevrons-right ${nextDisabled?'nav-disabled':''}" onclick="${nextDisabled?'':'__navYear(1)'}"></i>
        </div>
        <div class="cal-month-grid">${months.join('')}</div>
        <div class="cal-hint">仅支持查询近 12 个月账单（${MIN_YEAR}-${pad2(MIN_MONTH)} 至 ${CURRENT_YEAR}-${pad2(CURRENT_MONTH)}）</div>
      </div>
    `;
  }

  function renderRepayPage(){
    const list = state.space === 'personal' ? repayRecords.filter(r => r.account === '个人空间') : repayRecords;
    const { items, page, totalPages, total } = paginate(list, state.repayPage, PAGE_SIZE);
    const paidTotal = list.reduce((a,r)=>a+r.cash+r.coupon+r.card,0);
    return `
      <div class="crumb" onclick="__backToOverview()"><i class="ti ti-chevron-left"></i> 返回月账单概览</div>
      <div class="page-title"><div class="page-title-left"><div class="bar"></div>还款详情</div></div>
      <div class="repay-summary">
        <div><div class="label">账单月份</div><div class="value">${state.billMonth}</div></div>
        <div><div class="label">已还款金额</div><div class="value money">${money(paidTotal)}</div></div>
      </div>
      <div class="section-title" style="margin-top:0">还款明细</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>资源购买账号</th><th>应付金额</th><th>代金券抵扣金额</th><th>账户余额支付</th><th>现金支付金额</th><th>还款账户名称</th></tr></thead>
          <tbody>
            ${items.length ? items.map(r => `
              <tr>
                <td>${r.account}</td>
                <td class="money">${money(r.payable)}</td>
                <td class="money">${money(r.coupon)}</td>
                <td class="money">${money(r.card)}</td>
                <td class="money">${money(r.cash)}</td>
                <td>${r.payer}</td>
              </tr>
            `).join('') : `<tr class="empty-row"><td colspan="6">暂无内容</td></tr>`}
          </tbody>
        </table>
        ${renderPagination(page, totalPages, total, '__setRepayPage(-1)', '__setRepayPage(1)')}
      </div>
    `;
  }

  function renderExportModal(){
    const isEnt = state.space === 'enterprise';
    const hasOrgFilter = isEnt && state.orgFilter;
    return `
      <div class="modal-mask" onclick="__closeExportModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
          <div class="modal-head"><div class="title">导出</div><div class="close" onclick="__closeExportModal()"><i class="ti ti-x"></i></div></div>
          ${hasOrgFilter ? `
          <div class="modal-row">
            <div class="rlabel">导出范围</div>
            <div style="font-size:13px;color:#4e5969;display:flex;align-items:center;gap:14px">
              <span>跟随当前页面筛选：<b>${acctDisplayName(state.orgFilter)}</b></span>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#1677d6;cursor:pointer">
                <input type="checkbox"> 改为导出全部账号
              </label>
            </div>
          </div>` : ``}
          <div class="modal-row">
            <div class="rlabel"><span class="req">*</span>账单月份</div>
            <div class="month-range">
              <input type="month" value="${state.billMonth}"> <span>—</span> <input type="month" value="${state.billMonth}">
            </div>
          </div>
          <div class="modal-row">
            <div class="rlabel"><span class="req">*</span>导出类型</div>
            <div class="check-row">
              <label><input type="checkbox" checked> 月账单 PDF</label>
              <label><input type="checkbox" checked> 产品消费汇总 CSV</label>
            </div>
          </div>
          <div class="modal-row">
            <div class="rlabel">商品筛选</div>
            <div style="display:flex;gap:10px">
              <select class="msel" style="flex:1">
                <option>默认包含全部</option>
                ${[...new Set(productRows.map(r=>r.product))].map(p=>`<option>${p}</option>`).join('')}
              </select>
              <select class="msel"><option>包含所选</option><option>排除所选</option></select>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn" onclick="__closeExportModal()">取消</button>
            <button class="btn btn-primary" onclick="__closeExportModal()">确认导出</button>
          </div>
        </div>
      </div>
    `;
  }

  function filteredRows(){
    let rows = productRows.filter(r => r.month === state.billMonth);
    if (state.space === 'personal') rows = rows.filter(r => r.org === '个人空间');
    else rows = rows.filter(r => r.org !== '个人空间');
    if (state.orgFilter) rows = rows.filter(r => r.org === state.orgFilter);
    return rows;
  }

  function renderAcctDrop(){
    return `
      <div class="acct-drop" onclick="event.stopPropagation()">
        <input class="acct-search" placeholder="搜索账户名称/标识" oninput="__filterAcctList(this.value)">
        <div class="acct-list">
          <div class="acct-item ${!state.orgFilter?'selected':''}" onclick="__selectAcct(null)">
            <div class="acct-item-main"><span class="acct-item-name">全部账户</span></div>
          </div>
          ${acctRows.map(a => `
            <div class="acct-item ${state.orgFilter===a.acctId?'selected':''}" data-name="${a.acctName.toLowerCase()}" data-id="${a.acctId.toLowerCase()}" onclick="__selectAcct('${a.acctId}')">
              <div class="acct-item-main">
                <span class="acct-item-name">${a.acctName}</span>
                <span class="acct-item-id">${a.acctId}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderProductTable(rows){
    if (!rows.length) return `<table><tbody><tr class="empty-row"><td>暂无内容</td></tr></tbody></table>`;
    const { items, page, totalPages, total } = paginate(rows, state.prodPage, PAGE_SIZE);
    const showAcctCol = state.space === 'enterprise' && !state.orgFilter;
    return `
      <table>
        <thead><tr>
          <th></th><th>账单编号</th>${showAcctCol ? '<th>账户标识</th>' : ''}<th>产品名称</th><th>计费方式</th><th>账单月份</th><th>目录总价</th><th>优惠金额</th><th>优惠后金额</th><th>支付状态</th><th>操作</th>
        </tr></thead>
        <tbody>
          ${items.map((r) => {
            const idx = productRows.indexOf(r);
            const ledger = r.ledger || [{ ledgerType:'现金', acctType:'支付账户(个人/企业默认)', paid:r.paidAmt }];
            const isOpen = !!state.expanded[idx];
            return `
            <tr>
              <td><i class="ti ${isOpen?'ti-chevron-down':'ti-chevron-right'} expand-arrow" onclick="__toggleExpand(${idx})"></i></td>
              <td style="color:#1677d6">${r.billNo}</td>
              ${showAcctCol ? `<td>${acctShortLabel(r.org)}</td>` : ''}
              <td>${r.product}</td>
              <td>${r.feeType}</td>
              <td>${r.month}</td>
              <td class="money">${money(r.list)}</td>
              <td class="money">${money(r.discount)}</td>
              <td class="money">${money(r.afterDiscount)}</td>
              <td>${payBadge(r.payStatus)}</td>
              <td><span class="op-link" onclick="__openDetail(${idx})">详情</span></td>
            </tr>
            ${isOpen ? `
            <tr class="ledger-row"><td colspan="${showAcctCol?11:10}">
              <table class="ledger-table">
                <thead><tr><th>账单编号</th><th>账单月</th><th>账本类型</th><th>账户类型</th><th>实付金额</th></tr></thead>
                <tbody>
                  ${ledger.map(l => `
                    <tr>
                      <td style="color:#1677d6">${r.billNo}</td>
                      <td>${r.month.replace('-','')}</td>
                      <td>${l.ledgerType}</td>
                      <td>${l.acctType}</td>
                      <td class="money">${money(l.paid)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </td></tr>` : ''}
            `;
          }).join('')}
        </tbody>
      </table>
      ${renderPagination(page, totalPages, total, '__setProdPage(-1)', '__setProdPage(1)')}
    `;
  }

  function renderDetail(){
    const row = productRows[state.detailRow];
    const detail = row.detail || [
      { id:'1000000000000' + (10000+state.detailRow), time:'2026-07-01 12:00:00', amt:row.afterDiscount, paid:row.payStatus==='已销账'?row.afterDiscount:0, due:row.payStatus==='已销账'?0:row.afterDiscount }
    ];
    const { items, page, totalPages, total } = paginate(detail, state.detailPage, PAGE_SIZE);
    return `
      <div class="crumb" onclick="__backToList()"><i class="ti ti-chevron-left"></i> 返回账单列表</div>
      <div class="detail-head">
        <div class="item"><div class="label">账单编号</div><div class="value" style="color:#1677d6">${row.billNo}</div></div>
        <div class="item"><div class="label">服务名称</div><div class="value">${row.product}</div></div>
        ${row.org !== '个人空间' ? `<div class="item"><div class="label">账户标识</div><div class="value">${row.org}<br><span style="color:#86909c;font-size:12px">${acctRows.find(a=>a.acctId===row.org) ? acctRows.find(a=>a.acctId===row.org).acctName : ''}</span></div></div>` : ''}
        <div class="item"><div class="label">账单时间</div><div class="value">2026-07-01 - 2026-07-31</div></div>
        <div class="item"><div class="label">支付状态</div><div class="value">${payBadge(row.payStatus)}</div></div>
      </div>
      <div class="section-title">账单信息 <span style="font-weight:400;font-size:12px;color:#86909c">（该账单下的出账流水，见下表"出账流水号"）</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>出账流水号</th><th>出账时间</th><th>服务名称</th><th>账单金额</th><th>实付金额</th><th>待支付金额</th></tr></thead>
          <tbody>
            ${items.map(d => `
              <tr>
                <td style="color:#1677d6">${d.id}</td>
                <td>${d.time}</td>
                <td>${row.product}</td>
                <td class="money">${money(d.amt)}</td>
                <td class="money">${money(d.paid)}</td>
                <td class="money">${money(d.due)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${renderPagination(page, totalPages, total, '__setDetailPage(-1)', '__setDetailPage(1)')}
      </div>
    `;
  }

  window.__setSpace = function(s){ state.space = s; state.orgFilter=null; state.view='overview'; state.prodPage=1; render(); };
  window.__toggleAcctPicker = function(e){ e.stopPropagation(); state.acctOpen = !state.acctOpen; render(); };
  window.__selectAcct = function(id){ state.orgFilter = id; state.acctOpen = false; state.prodPage = 1; render(); };
  window.__filterAcctList = function(v){
    const q = v.toLowerCase();
    document.querySelectorAll('.acct-item[data-name]').forEach(function(el){
      const match = !q || el.dataset.name.includes(q) || el.dataset.id.includes(q);
      el.style.display = match ? '' : 'none';
    });
  };
  window.__openDetail = function(idx){ state.detailRow = idx; state.view = 'detail'; state.detailPage=1; render(); };
  window.__backToList = function(){ state.view = 'overview'; render(); };
  window.__openRepayPage = function(){ state.view = 'repay'; state.repayPage=1; render(); };
  window.__backToOverview = function(){ state.view = 'overview'; render(); };
  window.__toggleMonthPicker = function(e){ e.stopPropagation(); state.monthOpen = !state.monthOpen; render(); };
  window.__navYear = function(delta){ state.pickerYear += delta; render(); };
  window.__selectMonth = function(v){ state.billMonth = v; state.monthOpen = false; state.prodPage=1; state.orgPage=1; render(); };
  window.__openExportModal = function(){ state.showExportModal = true; render(); };
  window.__closeExportModal = function(){ state.showExportModal = false; render(); };
  window.__setProdPage = function(delta){ state.prodPage += delta; render(); };
  window.__setDetailPage = function(delta){ state.detailPage += delta; render(); };
  window.__setRepayPage = function(delta){ state.repayPage += delta; render(); };
  window.__toggleExpand = function(idx){ state.expanded[idx] = !state.expanded[idx]; render(); };
  document.addEventListener('click', function(){ if (state.monthOpen || state.acctOpen){ state.monthOpen = false; state.acctOpen = false; render(); } });

  render();
})();
</script>
</body>
</html>
